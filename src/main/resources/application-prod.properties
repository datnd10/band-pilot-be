# ─── PostgreSQL datasource (production — Supabase) ───────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Supabase uses SSL — required
spring.datasource.hikari.connection-init-sql=SELECT 1

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ─── Auth ────────────────────────────────────────────────────────────────────────
app.auth.username=${AUTH_USERNAME}
app.auth.password=${AUTH_PASSWORD}
app.auth.jwt-secret=${JWT_SECRET}
app.auth.jwt-expiration-ms=${JWT_EXPIRATION_MS:2592000000}

# ─── H2 console disabled ─────────────────────────────────────────────────────────
spring.h2.console.enabled=false

# ─── CORS — allow Vercel frontend ────────────────────────────────────────────────
# Set ALLOWED_ORIGINS env var on Render, e.g.: https://band-pilot.vercel.app
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}

# ─── SRS ─────────────────────────────────────────────────────────────────────────
# Notification is handled in-app via the due-count badge in the navigation bar.

# ─── Logging ─────────────────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.vn.com.datnd.bandpilot=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# ─── HikariCP keep-alive ─────────────────────────────────────────────────────
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
