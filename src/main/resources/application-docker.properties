# ─── PostgreSQL datasource (docker-compose local) ────────────────────────────────
# Host "postgres" matches the service name in docker-compose.yml
spring.datasource.url=jdbc:postgresql://postgres:5432/bandpilotdb
spring.datasource.username=bandpilot
spring.datasource.password=bandpilot
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# "update" auto-creates/alters tables on startup — fine for local development
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ─── H2 console disabled ─────────────────────────────────────────────────────────
spring.h2.console.enabled=false

# ─── Auth (single user) ──────────────────────────────────────────────────────
# Change these before deploying!
app.auth.username=${AUTH_USERNAME:admin}
app.auth.password=${AUTH_PASSWORD:bandpilot2024}
# 32+ char random secret for JWT signing
app.auth.jwt-secret=${JWT_SECRET:bandpilot-super-secret-key-change-me-32chars}
# Token validity in milliseconds (default: 30 days)
app.auth.jwt-expiration-ms=${JWT_EXPIRATION_MS:2592000000}
