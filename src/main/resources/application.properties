spring.application.name=band-pilot

# ─── Active profile ───────────────────────────────────────────────────────────────
# docker: PostgreSQL via docker-compose (local development)
# prod  : PostgreSQL via environment variables (CI / cloud deployment)
spring.profiles.active=docker

# ─── Flyway ───────────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ─── SRS ─────────────────────────────────────────────────────────────────────────
# Notification is handled in-app via the due-count badge in the navigation bar.
